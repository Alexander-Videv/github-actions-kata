name: 'Print Summary'
description: 'Generates JSON and text summaries from numbers input'

inputs:
  numbers:
    description: 'JSON payload of numbers'
    required: true

outputs:
  summary:
    description: 'Summary in JSON format'
    value: ${{ steps.run-summary.outputs.summary }}
  summary_text:
    description: 'Summary in plain text format'
    value: ${{ steps.run-summary.outputs.summary_text }}

runs:
  using: 'composite'
  steps:
    - name: Run print_summary.py
    id: run-summary
    shell: bash
    env:
      INPUT_NUMBERS: ${{ inputs.numbers }}
    run: |
      printf '%s' "$INPUT_NUMBERS" > summary.json
      python3 ci/print_summary.py summary.json
