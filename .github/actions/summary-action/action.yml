name: 'Summary Action'
description: 'Computes JSON summary from a JSON array of numbers'

inputs:
  numbers:
    description: 'JSON array of numbers as string'
    required: true

outputs:
  summary:
    description: 'Summary produced by print_summary.py (JSON)'
    value: ${{ steps.run-summary.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Run print_summary.py
      id: run-summary
      shell: bash
      env:
        INPUT_NUMBERS: ${{ inputs.numbers }}
      run: |
        SUMMARY=$(printf '%s' "$INPUT_NUMBERS" | python3 ci/print_summary.py)
        {
          echo 'summary<<EOF'
          echo "$SUMMARY"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
