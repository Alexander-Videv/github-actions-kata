name: Reusable Workflow
on: 
  workflow_call:
    inputs:
      numbers:
        description: 'JSON array numbers as string'
        type: string
        required: true
        default: '[1,2,3]'
    outputs:
      summary:
        description: 'Summary produced by composite action (JSON)'
        value: ${{ jobs.summarize.output.summary }}
      summary_text:
        description: 'Summary produced by composite action (human-readable)'
        value: ${{ jobs.summarize.output.summary_text }}
jobs:
  summarize:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.call-summary.outputs.summary }}
      summary_text: ${{ steps.format.outputs.summary_text }}
    steps:
      - uses: actions/checkout@v4

      - name: Call summary composite action
        id: call-summary
        uses: ./github/actions/summary-action
        with:
          number: ${{ inputs.numbers }}

      - name: Format summary
        id: format
        shell: bash
        run: |
          printf '%s' '${{ steps.call-summary.outputs.summary }}' > summary.json || true
          echo "summary_text=$(cat summary.json)" >> $GITHUB_OUTPUT
          
          python3 ./ci/format_summary.py summary.json > summary_text.txt
          echo "summary_text=$(cat summary_text.txt)" >> $GITHUB_OUTPUT
